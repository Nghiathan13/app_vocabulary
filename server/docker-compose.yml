services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: engvocab
      POSTGRES_PASSWORD: engvocab
      POSTGRES_DB: engvocab
    ports:
      - "5432:5432"
    volumes:
      - engvocab-postgres:/var/lib/postgresql/data

volumes:
  engvocab-postgres:
